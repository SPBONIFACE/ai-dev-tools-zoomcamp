name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AI_PROVIDER: mock
  PYTHONUNBUFFERED: "1"

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Code Quality & Lint Check
        run: uvx ruff check .

      - name: Automated Test Suite
        run: uv run python manage.py test

      - name: Docker Image Build Verification
        run: docker build -t chore-manager:ci .
