[project]
name = "ai-devops-m1"
version = "0.1.0"
description = "AI Household Chore Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "pydantic>=2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "migrations",
    "*/migrations/*",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401", "F841"]



