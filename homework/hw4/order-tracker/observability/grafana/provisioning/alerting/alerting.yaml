apiVersion: 1

contactPoints:
  - orgId: 1
    name: responder-webhook
    receivers:
      - uid: responder-webhook-1
        type: webhook
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: responder-webhook
    group_by: ['alertname', 'service']

groups:
  - orgId: 1
    name: order-tracker-alerts
    folder: Alerts
    interval: 10s
    rules:
      - uid: order-tracker-5xx
        title: "Order Tracker 5xx Server Error"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(http_requests_total{status_code=~"5.*"}) or vector(0)
              instant: false
              range: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
              expression: B
              type: threshold
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10s
        annotations:
          summary: "5xx server errors detected on Order Tracker endpoint"
          description: "Endpoint /api/orders/{order_id} returned 5xx server error. Dashboard: http://localhost:3000/d/order-tracker"
          dashboard_url: "http://localhost:3000/d/order-tracker"
          endpoint: "/api/orders/{order_id}"
        labels:
          severity: critical
          service: order-tracker
          alertname: OrderTracker5xxError
